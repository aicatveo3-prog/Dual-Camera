name = "dual-camera-signal"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Durable Object 하나로 방(room)을 표현한다.
# 방 코드 → idFromName → 항상 같은 인스턴스로 라우팅된다.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 무료 플랜에서는 SQLite 기반 Durable Object를 써야 한다.
# (new_classes 가 아니라 new_sqlite_classes)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 관측이 필요하면 주석을 풀면 된다.
# [observability]
# enabled = true
